<style>
/* ---------- Minimal Leaflet core CSS (inlined) ---------- */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;outline:none}
.leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y}
.leaflet-container.leaflet-touch-drag{touch-action:none}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom{touch-action:none}
.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-image-layer,.leaflet-pane>svg path,.leaflet-tile-container{pointer-events:none}
.leaflet-marker-icon.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}
.leaflet-control-container{display:none}
.leaflet-dragging .leaflet-grab{cursor:grabbing}

/* ---------- App ---------- */
:root{
  --ink:#0f1724; --ink2:#3b4658; --muted:#7a8496; --line:#e6e9ef;
  --bg:#f6f7fb; --card:#ffffff;
  --ice:#2f7cf6; --hoop:#f47a1f; --pitch:#14a660;
  --accent:#ff3b5c; --gold:#ffb400;
  --water:#cfe3f3; --land:#f3efe6; --border:#cfc6b5;
  --r:22px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --nav-h:64px;
  --ease:cubic-bezier(.2,.9,.25,1.05);
  --ease-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--water);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
.display{font-family:"Bricolage Grotesque",Inter,system-ui,sans-serif;letter-spacing:-.02em}

#map{position:fixed;inset:0;background:var(--water)}
#map.no-map{background:linear-gradient(160deg,#dfeaf5,#f3efe6)}

/* Top search */
.top{position:fixed;left:0;right:0;top:0;z-index:1000;padding:calc(var(--safe-t) + 10px) 12px 0;pointer-events:none}
.search{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;height:52px;padding:0 8px 0 14px;box-shadow:0 6px 24px rgba(15,23,36,.14),0 1px 2px rgba(15,23,36,.08);transition:box-shadow .3s,transform .3s var(--ease-out)}
.search:focus-within{box-shadow:0 10px 34px rgba(15,23,36,.22),0 0 0 3px rgba(47,124,246,.25)}
.logo{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#ff8a3d);display:grid;place-items:center;flex:none;color:#fff;font-weight:800;font-size:14px}
.search input{flex:1;border:0;outline:0;background:none;font-size:16px;min-width:0}
.search input::placeholder{color:var(--muted)}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;transition:background .2s,transform .15s}
.icon-btn:active{transform:scale(.9);background:#eef1f6}
.chips{pointer-events:auto;display:flex;gap:8px;overflow-x:auto;padding:10px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;background:var(--card);box-shadow:0 3px 12px rgba(15,23,36,.12);font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;transition:background .25s,color .25s,transform .2s var(--ease)}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--ink);color:#fff}
.chips.sub{padding-top:2px}
.chips.sub .chip{height:31px;font-size:13px;padding:0 12px}
#leagueChips:empty{display:none}
#leagueChips .chip{animation:rise .35s var(--ease-out) both}
#leagueChips .chip.on{background:var(--accent)}
.lpills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lpill{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:#eef1f7;color:var(--ink2)}
.lpill.lv{background:var(--ink);color:#fff}
.pin.small{transform:scale(.82)}
.chip .dot{width:8px;height:8px;border-radius:50%}

/* Search results */
.results{pointer-events:auto;margin-top:8px;background:var(--card);border-radius:18px;box-shadow:0 12px 40px rgba(15,23,36,.2);max-height:min(60vh,460px);overflow:auto;transform-origin:top center;transform:translateY(-8px) scale(.98);opacity:0;visibility:hidden;transition:opacity .22s,transform .3s var(--ease-out),visibility 0s .3s}
.results.open{opacity:1;transform:none;visibility:visible;transition:opacity .22s,transform .35s var(--ease-out)}
.res{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;border-bottom:1px solid var(--line);animation:rise .35s var(--ease-out) both}
.res:last-child{border-bottom:0}
.res:active{background:#f2f4f8}
.res .t{font-weight:600;font-size:15px}
.res .s{font-size:13px;color:var(--muted);margin-top:2px}
.res .sc{margin-left:auto;font-weight:700;font-size:14px;flex:none}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:14px}
.badge{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:19px}
.b-hockey{background:#e5efff}.b-basketball{background:#fff0e3}.b-soccer{background:#e1f6ea}

/* Floating map controls */
.fabs{position:fixed;right:12px;z-index:900;display:flex;flex-direction:column;gap:10px;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);transition:bottom .45s var(--ease-out),opacity .3s}
.fab-group{background:var(--card);border-radius:16px;box-shadow:0 6px 20px rgba(15,23,36,.16);overflow:hidden;display:flex;flex-direction:column}
.fab-group .icon-btn{width:46px;height:46px;border-radius:0}
.fab-group .icon-btn+.icon-btn{border-top:1px solid var(--line)}
.fab-add{width:52px;height:52px;border-radius:18px;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(255,59,92,.45);transition:transform .2s var(--ease)}
.fab-add:active{transform:scale(.9) rotate(90deg)}
body.sheet-open .fabs{opacity:0;pointer-events:none}

/* Markers */
.pin{width:40px;height:48px;position:relative;transform-origin:50% 100%;animation:pinIn .55s var(--ease) both}
.pin .head{position:absolute;left:2px;top:0;width:36px;height:36px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);box-shadow:0 4px 10px rgba(15,23,36,.3);border:2.5px solid #fff;transition:transform .3s var(--ease)}
.pin .em{position:absolute;left:0;top:5px;width:40px;text-align:center;font-size:17px;line-height:26px}
.pin .sc{position:absolute;right:-8px;top:-6px;background:var(--ink);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 5px;border:2px solid #fff}
.pin.hockey .head{background:var(--ice)}.pin.basketball .head{background:var(--hoop)}.pin.soccer .head{background:var(--pitch)}
.pin.multi .head{background:conic-gradient(var(--ice) 0 50%,var(--hoop) 50% 100%)}
.pin.sel .head{transform:rotate(-45deg) scale(1.25)}
.pin.sel{z-index:10}
.pin .lbl{position:absolute;left:44px;top:8px;white-space:nowrap;font-size:12px;font-weight:700;color:var(--ink);text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 4px #fff;opacity:0;transform:translateX(-4px);transition:opacity .3s,transform .3s;pointer-events:none}
.show-labels .pin .lbl{opacity:1;transform:none}
.pin.custom .head{background:#7b5cff}
.pulse{position:absolute;left:8px;top:30px;width:24px;height:12px;border-radius:50%;background:radial-gradient(closest-side,rgba(15,23,36,.28),rgba(15,23,36,0))}
.pin .head{box-shadow:0 2px 5px rgba(15,23,36,.28)!important}
.pin.sel .head{box-shadow:0 4px 10px rgba(15,23,36,.35)!important}
.cluster{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;font-family:"Bricolage Grotesque",Inter,sans-serif;border:3px solid #fff;box-shadow:0 3px 8px rgba(15,23,36,.3);animation:clIn .35s var(--ease) both;transition:transform .2s}
.cluster:active{transform:scale(.9)}
.cluster.big{width:56px;height:56px;font-size:16px}
.cluster.huge{width:66px;height:66px;font-size:18px}
@keyframes clIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
.leaflet-dragging .pin,.leaflet-zoom-anim .pin{animation:none!important}
.pin.sel .ring{position:absolute;left:-10px;top:-10px;width:60px;height:60px;border-radius:50%;border:3px solid var(--accent);animation:ping 1.6s ease-out infinite}
.city-lbl{font-size:11px;font-weight:600;color:#8a7f6a;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;text-shadow:0 0 3px var(--land),0 0 3px var(--land);pointer-events:none;transform:translate(-50%,14px)}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:1200;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);background:#fff;border-top:1px solid rgba(15,23,36,.06);display:flex}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative;transition:color .25s}
.nav button svg{transition:transform .35s var(--ease)}
.nav button.on{color:var(--ink)}
.nav button.on svg{transform:translateY(-2px) scale(1.12)}
.nav .ind{position:absolute;top:6px;width:44px;height:30px;border-radius:12px;background:#eef1f7;z-index:-1;transform:scale(.4);opacity:0;transition:transform .35s var(--ease),opacity .25s}
.nav button.on .ind{transform:none;opacity:1}

/* Bottom sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1100;height:calc(92vh - var(--safe-t));background:var(--card);border-radius:var(--r) var(--r) 0 0;box-shadow:0 -10px 40px rgba(15,23,36,.2);transform:translateY(110%);display:flex;flex-direction:column;will-change:transform}
.sheet.anim{transition:transform .5s var(--ease-out)}
.grab{padding:10px 0 4px;display:flex;justify-content:center;touch-action:none;cursor:grab;flex:none}
.grab span{width:40px;height:5px;border-radius:9px;background:#d5d9e2}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;flex:1;padding:4px 18px calc(var(--nav-h) + var(--safe-b) + 24px)}
.sheet.peek .sheet-body{overflow:hidden}
.d-head{display:flex;gap:12px;align-items:flex-start;touch-action:none}
.d-head .badge{width:48px;height:48px;font-size:24px;border-radius:15px}
.d-title{font-size:23px;font-weight:800;line-height:1.1;margin:2px 0 4px}
.d-sub{font-size:13.5px;color:var(--muted);line-height:1.35}
.close{margin-left:auto;width:34px;height:34px;border-radius:50%;background:#eef1f6;display:grid;place-items:center;flex:none;transition:transform .2s}
.close:active{transform:scale(.88) rotate(90deg)}
.overall{display:flex;align-items:center;gap:16px;margin:18px 0 6px}
.ringwrap{position:relative;width:86px;height:86px;flex:none}
.ringwrap svg{transform:rotate(-90deg)}
.ringwrap .num{position:absolute;inset:0;display:grid;place-items:center;font-family:"Bricolage Grotesque";font-weight:800;font-size:27px}
.ring-fg{transition:stroke-dashoffset 1.2s var(--ease-out)}
.ov-txt .big{font-weight:700;font-size:17px}
.ov-txt .small{font-size:13px;color:var(--muted);margin-top:3px}
.cta{width:100%;height:54px;border-radius:16px;background:var(--ink);color:#fff;font-weight:700;font-size:16px;margin:14px 0 4px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .2s var(--ease),box-shadow .3s;box-shadow:0 8px 20px rgba(15,23,36,.25)}
.cta:active{transform:scale(.97)}
.cta.alt{background:var(--accent);box-shadow:0 8px 20px rgba(255,59,92,.35)}
.sec{margin-top:22px}
.sec h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px;font-weight:700}
.thermo{position:relative;height:14px;border-radius:9px;background:linear-gradient(90deg,#4aa3ff,#9ad1ff 30%,#9be7a9 50%,#ffc46b 72%,#ff5a3c)}
.thermo .knob{position:absolute;top:50%;left:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(15,23,36,.3);display:grid;place-items:center;font-size:14px;transition:left 1.1s var(--ease-out)}
.thermo-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:10px}
.thermo-v{font-weight:700;font-size:15px;margin-bottom:12px}
.bar-row{margin-bottom:14px}
.bar-top{display:flex;justify-content:space-between;font-size:14.5px;font-weight:600;margin-bottom:7px}
.bar-top span:last-child{color:var(--ink2)}
.bar{height:10px;border-radius:9px;background:#eef1f6;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;transition:width 1.1s var(--ease-out)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:13px;font-weight:600;padding:7px 11px;border-radius:999px;background:#f2f4f8;animation:rise .4s var(--ease-out) both}
.tag b{color:var(--muted);font-weight:600;margin-left:4px}
.review{padding:14px 0;border-top:1px solid var(--line);animation:rise .45s var(--ease-out) both}
.rv-top{display:flex;align-items:center;gap:10px}
.rv-top img{width:30px;height:30px;border-radius:50%}
.rv-name{font-weight:600;font-size:14px}
.rv-date{font-size:12px;color:var(--muted)}
.rv-sc{margin-left:auto;font-weight:700;font-size:14px}
.rv-mini{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:8px}
.rv-c{font-size:14.5px;line-height:1.45;margin-top:8px;white-space:pre-wrap;word-wrap:break-word}

/* Full-screen views */
.view{position:fixed;inset:0;z-index:1150;background:var(--bg);overflow-y:auto;padding:calc(var(--safe-t) + 18px) 16px calc(var(--nav-h) + var(--safe-b) + 24px);transform:translateX(100%);opacity:.6;visibility:hidden;transition:transform .5s var(--ease-out),opacity .4s,visibility 0s .5s}
.view.on{transform:none;opacity:1;visibility:visible;transition:transform .5s var(--ease-out),opacity .4s}
.view.left{transform:translateX(-30%)}
.view h1{font-size:32px;font-weight:800;margin:6px 0 4px}
.view .lead{color:var(--muted);font-size:14.5px;margin:0 0 14px}
.seg{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg .chip{box-shadow:none;border:1px solid var(--line)}
.rank{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px;margin-bottom:10px;width:100%;text-align:left;box-shadow:0 2px 10px rgba(15,23,36,.05);animation:rise .45s var(--ease-out) both;transition:transform .2s var(--ease)}
.rank:active{transform:scale(.98)}
.rank .n{width:28px;text-align:center;font-family:"Bricolage Grotesque";font-weight:800;font-size:18px;color:var(--muted);flex:none}
.rank.top1 .n{color:var(--gold)}.rank.top2 .n{color:#9aa4b5}.rank.top3 .n{color:#c9834a}
.rank .mid{min-width:0;flex:1}
.rank .t{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .s{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .v{font-family:"Bricolage Grotesque";font-weight:800;font-size:20px;flex:none;text-align:right}
.rank .v small{display:block;font-family:Inter;font-weight:500;font-size:11px;color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);background:var(--card);border-radius:999px;padding:7px 12px;margin-bottom:14px;box-shadow:0 2px 8px rgba(15,23,36,.06)}
.status i{width:8px;height:8px;border-radius:50%;background:#aab3c2}
.status.live i{background:#18b368;box-shadow:0 0 0 4px rgba(24,179,104,.18)}

/* Rating modal */
.modal{position:fixed;inset:0;z-index:1300;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .55s var(--ease-out);visibility:hidden}
.modal.on{transform:none;visibility:visible}
.m-head{display:flex;align-items:center;gap:10px;padding:calc(var(--safe-t) + 12px) 14px 12px;background:var(--bg)}
.m-head .t{font-weight:700;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-body{flex:1;overflow-y:auto;padding:4px 16px 24px}
.m-foot{padding:12px 16px calc(var(--safe-b) + 12px);background:var(--bg);border-top:1px solid var(--line)}
.q{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(15,23,36,.05);animation:rise .5s var(--ease-out) both}
.q h4{margin:0 0 3px;font-size:16.5px}
.q p{margin:0 0 14px;font-size:13px;color:var(--muted)}
.temps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.temps button{border-radius:14px;padding:10px 2px 8px;background:#f2f4f8;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--ink2);transition:transform .3s var(--ease),background .25s,color .25s,box-shadow .25s}
.temps button span{font-size:26px;transition:transform .4s var(--ease)}
.temps button.on{color:#fff;transform:translateY(-3px);box-shadow:0 8px 18px rgba(15,23,36,.2)}
.temps button.on span{transform:scale(1.18)}
.temps button:nth-child(1).on{background:#3b8cff}.temps button:nth-child(2).on{background:#64b7f5}.temps button:nth-child(3).on{background:#22b673}.temps button:nth-child(4).on{background:#ffa23a}.temps button:nth-child(5).on{background:#ff5136}
.stars{display:flex;gap:6px;align-items:center}
.stars button{width:46px;height:46px;display:grid;place-items:center}
.stars svg{width:36px;height:36px;fill:#e3e7ee;transition:fill .2s,transform .45s var(--ease)}
.stars button.on svg{fill:var(--gold)}
.stars button.pop svg{animation:starPop .5s var(--ease)}
.slabel{margin-left:auto;font-weight:700;font-size:14px;color:var(--ink2);min-width:64px;text-align:right}
.ftags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.ftags button{padding:8px 12px;border-radius:999px;background:#f2f4f8;font-size:13.5px;font-weight:600;transition:background .2s,color .2s,transform .25s var(--ease)}
.ftags button.on{background:var(--ink);color:#fff;transform:scale(1.04)}
.ftags button.other{border:1.5px dashed #c5ccd8;background:#fff}
.ftags button.other.on{border-style:solid;border-color:var(--ink);background:var(--ink)}
.other-box{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease-out),margin .4s;margin-top:0}
.other-box>input{min-height:0;overflow:hidden;width:100%;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;height:0;font-size:16px;outline:0;background:#fbfcfe;transition:height .4s var(--ease-out),border-color .2s;opacity:0}
.other-box.open{grid-template-rows:1fr;margin-top:10px}
.other-box.open>input{height:46px;opacity:1}
.other-box>input:focus{border-color:var(--ice)}
textarea{width:100%;min-height:96px;border:1.5px solid var(--line);border-radius:14px;padding:12px;font-size:16px;resize:none;outline:0;background:#fbfcfe;transition:border-color .2s}
textarea:focus{border-color:var(--ice)}
.count{font-size:12px;color:var(--muted);text-align:right;margin-top:6px}
.cta:disabled{opacity:.4;box-shadow:none}

/* Add arena */
.form label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
.form input[type=text]{width:100%;height:48px;border:1.5px solid var(--line);border-radius:14px;padding:0 12px;font-size:16px;outline:0;background:#fbfcfe}
.form input[type=text]:focus{border-color:var(--ice)}
.sport-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sport-pick button{height:64px;border-radius:14px;background:#f2f4f8;font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all .25s var(--ease)}
.sport-pick button span{font-size:22px}
.sport-pick button.on{background:var(--ink);color:#fff;transform:translateY(-2px)}
.placing{position:fixed;left:50%;top:calc(var(--safe-t) + 14px);z-index:1250;transform:translate(-50%,-140%);background:var(--ink);color:#fff;border-radius:16px;padding:12px 14px 12px 16px;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(15,23,36,.35);transition:transform .45s var(--ease);width:max-content;max-width:calc(100% - 24px)}
.placing.on{transform:translate(-50%,0)}
.placing button{background:rgba(255,255,255,.16);border-radius:10px;padding:7px 10px;font-size:13px}
body.placing-mode .top{transform:translateY(-120%);transition:transform .4s var(--ease-out)}
.top{transition:transform .4s var(--ease-out)}
.crosshair{position:fixed;left:50%;top:50%;z-index:950;width:44px;height:44px;margin:-44px 0 0 -22px;pointer-events:none;opacity:0;transform:translateY(-20px) scale(.6);transition:all .4s var(--ease)}
body.placing-mode .crosshair{opacity:1;transform:none}

/* Toast + success */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 18px);z-index:2000;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;transition:all .4s var(--ease);pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}
.done{position:fixed;inset:0;z-index:1900;pointer-events:none;display:grid;place-items:center;background:rgba(15,23,36,.35);opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
.done.on{opacity:1;visibility:visible;transition:opacity .3s}
.done .card{background:var(--card);border-radius:26px;padding:28px 34px;text-align:center;transform:scale(.7);transition:transform .5s var(--ease)}
.done.on .card{transform:none}
.done svg circle{stroke-dasharray:190;stroke-dashoffset:190}
.done svg path{stroke-dasharray:60;stroke-dashoffset:60}
.done.on svg circle{animation:draw .6s .1s var(--ease-out) forwards}
.done.on svg path{animation:draw .4s .55s var(--ease-out) forwards}
.done .t{font-weight:800;font-size:20px;margin-top:10px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:1950;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.6s cubic-bezier(.3,.6,.6,1) forwards}
.loader{position:fixed;left:50%;top:50%;z-index:800;transform:translate(-50%,-50%);font-size:13px;color:var(--ink2);background:rgba(255,255,255,.9);padding:10px 14px;border-radius:12px;transition:opacity .4s}
.notice{background:#fff7e6;border:1px solid #ffe0a3;color:#7a5200;border-radius:14px;padding:10px 12px;font-size:13px;margin:10px 0 0}


/* =====================================================================
   THEME: "NIGHT GAME" — arena lights down, jumbotron on
   ===================================================================== */
:root{
  --ink:#eaf2ff; --ink2:#b4c2dc; --muted:#7486a8; --line:#22304d;
  --bg:#070b16; --card:#111a2e; --card2:#18233c;
  --ice:#3d7bff; --hoop:#ff8a2b; --pitch:#1fd17a;
  --accent:#ff2d4b; --gold:#ffcf33; --blue:#2b6cff;
  --water:#070d1a; --land:#141e33; --border:#2b3a5e;
  --led:#ffcf33;
  --night:#070b16;
  --stripe:linear-gradient(90deg,var(--blue) 0 28%,transparent 28% 46%,var(--accent) 46% 54%,transparent 54% 72%,var(--blue) 72%);
}
html,body{font-family:Barlow,system-ui,sans-serif;background:var(--water)}
.display,.d-title,.view h1{font-family:"Big Shoulders Display",Barlow,sans-serif!important;letter-spacing:.01em;text-transform:uppercase}
#map{background:radial-gradient(ellipse at 50% 30%,#0d1730 0%,#070d1a 70%)}
#map.no-map{background:radial-gradient(ellipse at 50% 30%,#0d1730 0%,#070d1a 70%)}
.loader{background:var(--card);color:var(--ink2);border:1px solid var(--line)}

/* search */
.search{background:rgba(13,20,38,.96);border:1px solid #25345a;box-shadow:0 10px 30px rgba(0,0,0,.5);border-radius:14px}
.search:focus-within{box-shadow:0 10px 34px rgba(0,0,0,.55),0 0 0 2px var(--accent)}
.logo{width:32px;height:32px;border-radius:50%;background:none;padding:0}
.logo svg{display:block}
.search input{font-weight:500}
.icon-btn:active{background:#1d2945}
/* slanted ticket chips */
.chip{background:rgba(17,26,46,.95);color:var(--ink2);box-shadow:none;border:0;border-radius:0;
  clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%);padding:0 20px;font-family:"Barlow Condensed",Barlow,sans-serif;font-size:15px;letter-spacing:.02em;text-transform:uppercase}
.chip.on{background:var(--accent);color:#fff}
.chips.sub .chip{font-size:13.5px;padding:0 16px}
.chips.sub .chip.on{background:var(--blue)}
#leagueChips .chip.on{background:var(--gold);color:#1a1300}
.seg .chip{border:0;background:var(--card2)}
.lpill{background:var(--card2);color:var(--ink2);border-radius:4px;font-family:"Barlow Condensed";letter-spacing:.04em;text-transform:uppercase}
.lpill.lv{background:var(--accent);color:#fff}

/* results */
.results{background:#0f182c;border:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.6);border-radius:14px}
.res{border-bottom:1px solid var(--line)}
.res:active{background:#18233c}
.res .sc{color:var(--led);font-family:"Big Shoulders Display";font-size:17px}
.b-hockey{background:rgba(61,123,255,.16)}.b-basketball{background:rgba(255,138,43,.16)}.b-soccer{background:rgba(31,209,122,.14)}
.badge{border-radius:10px}

/* fabs */
.fab-group{background:rgba(13,20,38,.96);border:1px solid var(--line);box-shadow:0 8px 22px rgba(0,0,0,.5);border-radius:12px}
.fab-group .icon-btn+.icon-btn{border-top:1px solid var(--line)}
.fab-add{border-radius:50%;box-shadow:0 0 0 4px rgba(255,45,75,.25),0 8px 24px rgba(255,45,75,.55)}

/* pins & clusters */
.pin .head{border-color:#fff}
.pin .sc{background:#0a0f1d;color:var(--led);border:1.5px solid var(--led);font-family:"Big Shoulders Display";font-size:12px;font-weight:800;padding:0 5px;border-radius:4px;text-shadow:0 0 6px rgba(255,207,51,.7)}
.pin .lbl{color:#eaf2ff;text-shadow:0 0 4px #070b16,0 0 4px #070b16,0 1px 2px #000;font-family:"Barlow Condensed";font-size:13px;letter-spacing:.02em}
.pin.sel .ring{border-color:var(--led);box-shadow:0 0 12px var(--led)}
.city-lbl{color:#6f84ad;text-shadow:0 0 3px #070d1a,0 0 3px #070d1a;font-family:"Barlow Condensed";letter-spacing:.14em}
.cluster{background:transparent!important;border:0;box-shadow:0 0 0 2px rgba(7,11,22,.9),0 6px 14px rgba(0,0,0,.55);font-family:"Big Shoulders Display";font-size:17px;position:relative}
.cluster::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--cg);z-index:-1}
.cluster::after{content:"";position:absolute;inset:5px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#22305a,#0b1122 70%);z-index:-1}
.cluster span{position:relative;text-shadow:none!important;color:#fff}

/* nav with rink lines */
.nav{background:#0a1020;border-top:0;box-shadow:0 -8px 24px rgba(0,0,0,.45)}
.nav::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--stripe)}
.nav button{font-family:"Barlow Condensed";font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
.nav button.on{color:#fff}
.nav .ind{background:rgba(255,45,75,.18);border-radius:8px}
.nav button.on svg{filter:drop-shadow(0 0 6px rgba(255,45,75,.8))}
.nav button.on{color:#fff}

/* sheet */
.sheet{background:#0d1528;box-shadow:0 -14px 40px rgba(0,0,0,.6);border-radius:18px 18px 0 0;overflow:hidden}
.sheet::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--stripe);z-index:2}
.grab span{background:#33456e}
.d-title{font-size:30px;font-weight:800;line-height:.98}
.close{background:#1a2641;color:var(--ink)}
/* jumbotron scoreboard */
.board{position:relative;display:flex;align-items:center;gap:16px;margin:18px 0 6px;padding:14px 16px;border-radius:12px;
  background:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.4px) 0 0/6px 6px,linear-gradient(180deg,#0a0f1d,#05080f);
  border:1px solid #2a3960;box-shadow:inset 0 0 30px rgba(0,0,0,.7),0 0 0 3px #0f1830}
.board .bl{font-family:"Barlow Condensed";font-size:12px;letter-spacing:.2em;color:#ff6a7f;text-transform:uppercase}
.board .num{font-family:"Big Shoulders Display";font-weight:900;font-size:64px;line-height:.85;color:var(--led);
  text-shadow:0 0 8px rgba(255,207,51,.85),0 0 24px rgba(255,170,0,.45);min-width:96px;font-variant-numeric:tabular-nums}
.board .num.off{color:#3a4566;text-shadow:none}
.board .of{font-family:"Big Shoulders Display";color:#7c6a2a;font-size:22px;align-self:flex-end;margin:0 0 6px -10px}
.board .txt{margin-left:auto;text-align:right}
.board .txt .big{font-family:"Big Shoulders Display";font-size:22px;text-transform:uppercase;color:#fff;font-weight:800}
.board .txt .small{font-size:12.5px;color:var(--muted);margin-top:3px}
.board.flash{animation:boardFlash 1.2s ease-out}
@keyframes boardFlash{0%,30%,60%{box-shadow:inset 0 0 30px rgba(0,0,0,.7),0 0 0 3px #0f1830,0 0 40px rgba(255,207,51,.6)}15%,45%,100%{box-shadow:inset 0 0 30px rgba(0,0,0,.7),0 0 0 3px #0f1830}}
.cta{background:#eaf2ff;color:#070b16;border-radius:10px;font-family:"Barlow Condensed";font-size:18px;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 8px 22px rgba(0,0,0,.4)}
.cta.alt{background:var(--accent);color:#fff;box-shadow:0 0 0 3px rgba(255,45,75,.25),0 10px 26px rgba(255,45,75,.45)}
.cta.ghost{background:var(--card2);color:var(--ink);box-shadow:none}
.sec h3{font-family:"Barlow Condensed";font-size:14px;letter-spacing:.18em;color:#8ea0c4;display:flex;align-items:center;gap:10px}
.sec h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#2a3960,transparent)}
.thermo{height:12px;border-radius:3px}
.thermo .knob{background:#0b1122;border:2px solid #fff;box-shadow:0 0 12px rgba(255,255,255,.4)}
.thermo-v{font-family:"Big Shoulders Display";font-size:20px;text-transform:uppercase}
/* LED segment bars */
.bar{height:14px;border-radius:2px;background:#151f37;-webkit-mask:repeating-linear-gradient(90deg,#000 0 calc(10% - 3px),transparent calc(10% - 3px) 10%);mask:repeating-linear-gradient(90deg,#000 0 calc(10% - 3px),transparent calc(10% - 3px) 10%)}
.bar i{border-radius:0;box-shadow:0 0 10px currentColor}
.bar-top span:last-child{color:var(--led);font-family:"Big Shoulders Display";font-size:17px}
.tag{background:var(--card2);color:var(--ink);border-radius:6px;border:1px solid #26355a}
.tag b{color:var(--led)}
.review{border-top:1px solid var(--line)}
.rv-sc{color:var(--led);font-family:"Big Shoulders Display";font-size:18px}
.rv-mini{color:var(--ink2)}
.notice{background:#2a2108;border-color:#5c4a12;color:#ffd970}

/* views */
.view{background:linear-gradient(180deg,#0b1224 0,#070b16 260px)}
.view h1{font-size:46px;font-weight:900;line-height:.9;margin:8px 0 6px;background:linear-gradient(180deg,#fff,#9fb4dd);-webkit-background-clip:text;background-clip:text;color:transparent}
.rank{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:none;position:relative;overflow:hidden}
.rank::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line)}
.rank.top1::before{background:var(--gold)}.rank.top2::before{background:#c7d2e6}.rank.top3::before{background:#d98a4a}
.rank .n{font-family:"Big Shoulders Display";font-size:22px}
.rank .t{font-family:"Barlow";font-weight:700}
.rank .v{font-family:"Big Shoulders Display";color:var(--led);font-size:24px;text-shadow:0 0 10px rgba(255,207,51,.35)}
.rank .v small{font-family:Barlow;color:var(--muted);text-shadow:none}
.status{background:var(--card);border:1px solid var(--line);box-shadow:none}

/* rating modal */
.modal{background:#070b16}
.m-head,.m-foot{background:#070b16}
.m-foot{border-top:1px solid var(--line)}
.m-head .t{font-family:"Big Shoulders Display";font-size:22px;text-transform:uppercase}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:none}
.q h4{font-family:"Big Shoulders Display";font-size:21px;text-transform:uppercase;letter-spacing:.02em}
.temps button{background:var(--card2);color:var(--ink2);border-radius:10px}
.stars svg{fill:#26324f}
.stars button.on svg{fill:var(--led);filter:drop-shadow(0 0 6px rgba(255,207,51,.7))}
.slabel{color:var(--led);font-family:"Big Shoulders Display";font-size:18px;text-transform:uppercase}
.ftags button{background:var(--card2);color:var(--ink2);border-radius:6px}
.ftags button.on{background:var(--accent);color:#fff}
.ftags button.other{background:transparent;border-color:#3a4b75}
.ftags button.other.on{background:var(--blue);border-color:var(--blue)}
.other-box>input,textarea,.form input[type=text]{background:#0b1222;border-color:#26355a;color:var(--ink)}
.sport-pick button{background:var(--card2);color:var(--ink2);border-radius:10px}
.sport-pick button.on{background:var(--accent);color:#fff}
.placing{background:#0d1528;border:1px solid #2a3960;color:#fff}
.placing button{background:var(--accent)}
.toast{background:#eaf2ff;color:#070b16;border-radius:8px;font-weight:700}

/* GOAL-LIGHT celebration */
.done{background:transparent}
.done::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(255,45,75,.75),rgba(255,45,75,.15) 60%,rgba(7,11,22,.6));opacity:0}
.done.on::before{animation:goalLight 1.3s steps(1) forwards}
@keyframes goalLight{0%{opacity:1}18%{opacity:.15}36%{opacity:1}54%{opacity:.15}72%{opacity:.9}100%{opacity:.4}}
.done .card{position:relative;background:#05080f;border:2px solid #2a3960;border-radius:14px;
  background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.4px);background-size:6px 6px}
.done .t{font-family:"Big Shoulders Display";font-weight:900;font-size:34px;text-transform:uppercase;color:var(--led);text-shadow:0 0 10px rgba(255,207,51,.9)}
.done svg circle,.done svg path{stroke:var(--led)}

/* ---------- The Barn Report brand ---------- */
.logo{width:36px;height:36px;border-radius:10px;background:#000;display:grid;place-items:center;border:1px solid #2a3960;margin-left:-6px}
.logo img{width:30px;height:30px;display:block}
.brand-eyebrow{display:flex;align-items:center;gap:8px;font-family:"Barlow Condensed";font-weight:700;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:#8ea0c4}
.brand-eyebrow img{width:22px;height:22px;background:#000;border-radius:6px;padding:2px}
.splash{position:fixed;inset:0;z-index:5000;background:radial-gradient(ellipse at 50% 40%,#111b33 0%,#05080f 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .6s ease,visibility 0s .6s}
.splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash img{width:132px;height:132px;clip-path:inset(0 100% 0 0);animation:sign 1s .15s cubic-bezier(.65,0,.35,1) forwards;filter:drop-shadow(0 0 18px rgba(255,255,255,.25))}
.splash .wm{font-family:"Big Shoulders Display",Barlow,sans-serif;font-weight:900;font-size:clamp(28px,9vw,44px);white-space:nowrap;text-align:center;width:100%;letter-spacing:.04em;color:#fff;text-transform:uppercase;opacity:0;transform:translateY(10px);animation:wmIn .6s .9s var(--ease-out) forwards}
.splash .wm span{color:var(--accent)}
.splash .tg{text-align:center;font-family:"Barlow Condensed";letter-spacing:.3em;font-size:13px;color:#7486a8;text-transform:uppercase;opacity:0;animation:wmIn .6s 1.15s var(--ease-out) forwards}
.splash .bar{width:120px;height:3px;background:var(--stripe);-webkit-mask:none;mask:none;border-radius:0;opacity:0;animation:wmIn .5s 1.05s forwards}
@keyframes sign{to{clip-path:inset(0 0 0 0)}}
@keyframes wmIn{to{opacity:1;transform:none}}
.done .card img{width:58px;height:58px;display:block;margin:0 auto 6px;background:#000;border-radius:12px;padding:4px}

/* ---------- MONOCHROME — matches the TB logo ---------- */
:root{
  --ink:#f4f4f4; --ink2:#bcbcbc; --muted:#777; --line:#242424;
  --bg:#000; --card:#0d0d0d; --card2:#171717;
  --ice:#ffffff; --hoop:#a8a8a8; --pitch:#5e5e5e;
  --accent:#ffffff; --gold:#ffffff; --blue:#8c8c8c; --led:#ffffff;
  --water:#000; --land:#121212; --border:#2c2c2c;
  --stripe:linear-gradient(90deg,transparent,rgba(255,255,255,.9) 25%,#fff 50%,rgba(255,255,255,.9) 75%,transparent);
}

#map,#map.no-map{background:#000}

.logo{border-color:#2a2a2a}

#leagueChips .chip.on{background:#9a9a9a}
.seg .chip{background:#171717}
.seg .chip.on{background:#fff;color:#000}
.brand-eyebrow{color:#9a9a9a}
.lpill{background:#1a1a1a;color:#bdbdbd}
.lpill.lv{background:#fff;color:#000}
.results{background:#0b0b0b;border-color:#242424}
.res:active{background:#161616}

.fab-add svg{stroke:#000}

.pin.hockey .head{background:#fff}.pin.basketball .head{background:#a8a8a8}.pin.soccer .head{background:#5e5e5e}
.pin.multi .head{background:conic-gradient(#fff 0 50%,#a8a8a8 50% 100%)}

.city-lbl{color:#5f5f5f;text-shadow:0 0 3px #000,0 0 3px #000}
.cluster::after{background:radial-gradient(circle at 40% 35%,#2a2a2a,#050505 70%)}

.nav .ind{background:rgba(255,255,255,.1)}
.nav button.on svg{filter:drop-shadow(0 0 6px rgba(255,255,255,.7))}
.sheet{background:#0a0a0a}
.grab span{background:#3a3a3a}
.close{background:#1c1c1c}
.board{background:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.4px) 0 0/6px 6px,linear-gradient(180deg,#0b0b0b,#000);border-color:#2c2c2c;box-shadow:inset 0 0 30px rgba(0,0,0,.8),0 0 0 3px #111}
.board .bl{color:#8a8a8a}
.board .num{color:#fff;text-shadow:0 0 8px rgba(255,255,255,.75),0 0 26px rgba(255,255,255,.3)}

.board .of{color:#555}
@keyframes boardFlash{0%,30%,60%{box-shadow:inset 0 0 30px rgba(0,0,0,.8),0 0 0 3px #111,0 0 40px rgba(255,255,255,.5)}15%,45%,100%{box-shadow:inset 0 0 30px rgba(0,0,0,.8),0 0 0 3px #111}}
.cta{background:transparent;color:#fff;border:1.5px solid #fff;box-shadow:none}

.slabel{color:#fff}

.ftags button.other.on{background:#bdbdbd;border-color:#bdbdbd;color:#000}
.other-box>input,textarea,.form input[type=text]{background:#080808;border-color:#2a2a2a}

/* line-art sport icons */
.sico{display:block;flex:none}
.chip .sico{display:inline-block;vertical-align:-3px;margin-right:6px}
.badge{color:#f4f4f4}
.badge .sico{width:22px;height:22px}
.d-head .badge .sico{width:28px;height:28px}
.pin .em{display:flex;align-items:center;justify-content:center;gap:1px;height:26px;top:5px;line-height:normal}
.pin.hockey .em,.pin.basketball .em,.pin.multi .em{color:#000}
.pin.soccer .em,.pin.custom .em{color:#fff}
.sport-pick button span{display:grid;place-items:center;height:26px}

/* line-art UI icons */
.ic{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.temps button span .ic{width:28px;height:28px;vertical-align:0}
.temps button.on span .ic{stroke-width:2}
.q h4 .ic{width:22px;height:22px;vertical-align:-3px;margin-right:4px}
.bar-top .ic{margin-right:4px;opacity:.85}
.chip .ic{margin-right:6px;width:16px;height:16px;vertical-align:-3px}
.thermo .knob .ic{width:16px;height:16px;color:#fff;vertical-align:0}
.cta .ic{width:20px;height:20px;vertical-align:-4px}
.rv-mini .ic{width:14px;height:14px;vertical-align:-2px;margin-right:2px}
.rank .s .ic{width:13px;height:13px;vertical-align:-2px}
.badge .ic{width:20px;height:20px;vertical-align:0}
.bigic{display:grid;place-items:center;margin-bottom:6px}
.bigic .ic{width:44px;height:44px;stroke-width:1.4}
.board .small .ic,.thermo-v .ic{width:1em;height:1em}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pinIn{0%{opacity:0;transform:translateY(-30px) scale(.4)}60%{opacity:1;transform:translateY(3px) scale(1.06)}100%{transform:none}}
@keyframes ping{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes starPop{0%{transform:scale(1)}35%{transform:scale(1.45) rotate(-12deg)}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--rot));opacity:.9}}
@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
.shake{animation:shake .5s}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (min-width:700px){
  .top{left:16px;right:auto;width:400px}

  .view,.modal{left:50%;right:auto;width:520px;margin-left:-260px;box-shadow:0 0 60px rgba(15,23,36,.25)}
}

/* ---- Geometry simplification: done once at load, so the map has far fewer points to redraw ---- */
function sqSegDist(p,a,b){let x=a[0],y=a[1],dx=b[0]-x,dy=b[1]-y;if(dx||dy){const t=((p[0]-x)*dx+(p[1]-y)*dy)/(dx*dx+dy*dy);if(t>1){x=b[0];y=b[1];}else if(t>0){x+=dx*t;y+=dy*t;}}dx=p[0]-x;dy=p[1]-y;return dx*dx+dy*dy;}
function simplifyLine(pts,tol){
  if(pts.length<=4)return pts;const sq=tol*tol;
  // radial pass
  const r=[pts[0]];let prev=pts[0];for(let i=1;i<pts.length;i++){const p=pts[i],dx=p[0]-prev[0],dy=p[1]-prev[1];if(dx*dx+dy*dy>sq){r.push(p);prev=p;}}
  if(prev!==pts[pts.length-1])r.push(pts[pts.length-1]);
  // Douglas-Peucker (iterative)
  const n=r.length,keep=new Uint8Array(n);keep[0]=keep[n-1]=1;const stack=[[0,n-1]];
  while(stack.length){const [f,l]=stack.pop();let max=sq,idx=0;for(let i=f+1;i<l;i++){const d=sqSegDist(r[i],r[f],r[l]);if(d>max){idx=i;max=d;}}if(idx){keep[idx]=1;stack.push([f,idx],[idx,l]);}}
  const out=[];for(let i=0;i<n;i++)if(keep[i])out.push(r[i]);return out;
}
function simplifyGeom(g,tol){
  if(!g)return null;
  const ring=c=>{const s=simplifyLine(c,tol);return s.length>=4?s:null};
  const line=c=>{const s=simplifyLine(c,tol);return s.length>=2?s:null};
  switch(g.type){
    case "Polygon":{const rs=g.coordinates.map(ring);if(!rs[0])return null;return {type:"Polygon",coordinates:rs.filter(Boolean)};}
    case "MultiPolygon":{const ps=g.coordinates.map(p=>{const rs=p.map(ring);return rs[0]?rs.filter(Boolean):null}).filter(Boolean);return ps.length?{type:"MultiPolygon",coordinates:ps}:null;}
    case "LineString":{const l=line(g.coordinates);return l?{type:"LineString",coordinates:l}:null;}
    case "MultiLineString":{const ls=g.coordinates.map(line).filter(Boolean);return ls.length?{type:"MultiLineString",coordinates:ls}:null;}
    default:return g;
  }
}
function simplifyGeo(gj,tol){
  if(gj.type==="FeatureCollection")return {type:"FeatureCollection",features:gj.features.map(f=>{const g=simplifyGeom(f.geometry,tol);return g?{type:"Feature",properties:{},geometry:g}:null}).filter(Boolean)};
  if(gj.type==="Feature"){const g=simplifyGeom(gj.geometry,tol);return g?{type:"Feature",properties:{},geometry:g}:{type:"FeatureCollection",features:[]};}
  const g=simplifyGeom(gj,tol);return g||{type:"FeatureCollection",features:[]};
}
const idle=f=>new Promise(r=>setTimeout(()=>r(f()),0));

async function loadBasemap(){

    async()=>{const [ta,tc]=await Promise.all([import("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json/+esm"),import("https://cdn.jsdelivr.net/npm/topojson-client@3/+esm")]);
      const topo=ta.default; return {fc:tc.feature(topo,topo.objects.countries),tc,topo};},
    async()=>({fc:(await import("https://cdn.jsdelivr.net/npm/@amcharts/amcharts5-geodata@5/worldLow.js")).default}),
    async()=>({fc:(await import("https://cdn.jsdelivr.net/npm/@amcharts/amcharts4-geodata@4/worldLow.js")).default}),
    async()=>({fc:(await import("https://unpkg.com/@amcharts/amcharts5-geodata@5/worldLow.js")).default})

/* Shapes that cross the 180° line jump from +180 to -180 and get drawn as stripes across the
   whole world. "Unwrap" each ring so its longitudes stay continuous, and drop Antarctica. */
function unwrapLine(c){const out=[];let off=0,prev=null;for(const pt of c){let x=pt[0]+off;
  if(prev!==null){while(x-prev>180){off-=360;x-=360;}while(x-prev<-180){off+=360;x+=360;}}out.push([x,pt[1]]);prev=x;}return out;}
function unwrapGeom(g){
  if(!g)return g;
  switch(g.type){
    case "Polygon":return {type:"Polygon",coordinates:g.coordinates.map(unwrapLine)};
    case "MultiPolygon":return {type:"MultiPolygon",coordinates:g.coordinates.map(p=>p.map(unwrapLine))};
    case "LineString":return {type:"LineString",coordinates:unwrapLine(g.coordinates)};
    case "MultiLineString":return {type:"MultiLineString",coordinates:g.coordinates.map(unwrapLine)};
    case "GeometryCollection":return {type:"GeometryCollection",geometries:g.geometries.map(unwrapGeom)};
    default:return g;
  }
}
function maxLat(g){let m=-90;const walk=a=>{if(typeof a[0]==="number"){if(a[1]>m)m=a[1];}else a.forEach(walk)};if(g&&g.coordinates)walk(g.coordinates);return m;}
function cleanGeo(gj){
  if(!gj)return gj;
  if(gj.type==="FeatureCollection")return {type:"FeatureCollection",features:gj.features.filter(f=>f.geometry&&maxLat(f.geometry)>-58).map(f=>({...f,geometry:unwrapGeom(f.geometry)}))};
  if(gj.type==="Feature")return {...gj,geometry:unwrapGeom(gj.geometry)};
  return unwrapGeom(gj);
}
function drawGrid(style){

}
let CITIES=[];
function drawCities(){
  const seen={}; ARENAS.forEach(a=>{const c=a.city.split(",")[0];if(!c)return;(seen[c]=seen[c]||[]).push(a)});

}
function pinHtml(a,st,i){

}
function passFilters(a,sport,level,league){return (sport==="all"||a.sports.includes(sport))&&(level==="all"||a.levels.includes(level))&&(league==="all"||a.leagues.includes(league));}

let pinRAF=0, firstPins=true;
function schedulePins(){if(pinRAF)return;pinRAF=requestAnimationFrame(()=>{pinRAF=0;renderPins();});}
function drawMarkers(animate=true){
  if(!map)return;

  renderPins(animate);
}
function pinIcon(a,anim){let html=pinHtml(a,stats(a.id),0);if(!anim)html=html.replace("animation-delay:0ms","animation:none");
  return L.divIcon({className:"",html,iconSize:[40,48],iconAnchor:[20,46]});}
function clusterIcon(g){
  const n=g.items.length,cnt={hockey:0,basketball:0,soccer:0};g.items.forEach(a=>a.sports.forEach(s=>cnt[s]++));
  const tot=cnt.hockey+cnt.basketball+cnt.soccer||1;let acc=0;const stops=[];
  for(const k of ["hockey","basketball","soccer"]){if(!cnt[k])continue;const from=acc/tot*100;acc+=cnt[k];stops.push(`${SPORT[k].color} ${from.toFixed(1)}% ${(acc/tot*100).toFixed(1)}%`);}
  const sz=n>=50?"huge":n>=12?"big":"";const px=n>=50?66:n>=12?56:46;
  return L.divIcon({className:"",html:`<div class="cluster ${sz}" style="--cg:conic-gradient(${stops.join(",")})"><span style="text-shadow:0 1px 3px rgba(0,0,0,.45)">${n}</span></div>`,iconSize:[px,px],iconAnchor:[px/2,px/2]});
}
function renderPins(animate=false){
  if(!map)return;

  const inView=a=>b.contains([a.lat,a.lng]);
  const all=visibleArenas();
  const vis=all.filter(inView);
  const want={};
  const CELL=z>=10.5?0:z>=7?44:58;
  const sel=S.selected&&BYID[S.selected];
  const singles=[],groups={};
  for(const a of (CELL?all:vis)){
    if(!CELL||a.id===S.selected){if(inView(a))singles.push(a);continue;}
    const p=map.project([a.lat,a.lng],Math.round(z));const k=Math.floor(p.x/CELL)+":"+Math.floor(p.y/CELL);
    (groups[k]=groups[k]||[]).push(a);
  }
  for(const [k,items] of Object.entries(groups)){
    if(items.length===1){if(inView(items[0]))singles.push(items[0]);continue;}
    const lat=items.reduce((t,a)=>t+a.lat,0)/items.length,lng=items.reduce((t,a)=>t+a.lng,0)/items.length;
    if(b.contains([lat,lng]))want["c:"+Math.round(z)+":"+k+":"+items.length]={items,lat,lng};}
  if(sel&&!vis.includes(sel)&&passFilters(sel,S.sport,S.level,S.league))singles.push(sel);
  singles.forEach(a=>want["a:"+a.id]={a});
  // cities
  if(cityLayer&&z>=5.5)for(const c of CITIES)if(b.contains([c.lat,c.lng]))want["t:"+c.name]={city:c};
  // remove stale
  for(const k of Object.keys(markers))if(!want[k]){markers[k].remove();delete markers[k];}
  // add new

    let m;
    if(v.a){const a=v.a;m=L.marker([a.lat,a.lng],{icon:pinIcon(a,true),zIndexOffset:S.selected===a.id?1000:0});
      if(anim)m.options.icon.options.html=m.options.icon.options.html.replace("animation-delay:0ms",`animation-delay:${Math.min(i++*10,500)}ms`);
      m.on("click",e=>{L.DomEvent.stopPropagation(e);openArena(a.id)});}
    else if(v.items){const items=v.items,lat=v.lat,lng=v.lng;
      m=L.marker([lat,lng],{icon:clusterIcon(v),zIndexOffset:500});
      m.on("click",e=>{L.DomEvent.stopPropagation(e);const bb=L.latLngBounds(items.map(a=>[a.lat,a.lng]));
        if(bb.getNorthEast().distanceTo(bb.getSouthWest())<300)map.flyTo(bb.getCenter(),Math.max(map.getZoom()+2,12),{duration:.7});
        else map.flyToBounds(bb,{padding:[60,60],paddingTopLeft:[30,170],paddingBottomRight:[70,100],maxZoom:14,duration:.8});});}
    else{const c=v.city;m=L.marker([c.lat,c.lng],{interactive:false,keyboard:false,zIndexOffset:-1000,icon:L.divIcon({className:"",html:`<div class="city-lbl">${esc(c.name)}</div>`,iconSize:[0,0]})});}
    m.addTo(map);markers[k]=m;
  }
  firstPins=false;
}
function refreshMarker(id){
  const a=BYID[id],m=markers["a:"+id];

  S.mode="shared";S.myId=id;S.reviewsByUser={};S.placesByUser={};S.fixesByUser={};

    const V="10.12.2",B="https://www.gstatic.com/firebasejs/"+V+"/";
    const [appM,authM,fs]=await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-auth.js"),import(B+"firebase-firestore.js")]);
    const app=appM.initializeApp(cfg), auth=authM.getAuth(app), store=fs.getFirestore(app);
    const u=await new Promise((res,rej)=>{const un=authM.onAuthStateChanged(auth,x=>{if(x){un();res(x)}});authM.signInAnonymously(auth).catch(rej);});
    // small adapter so the rest of the app talks to Firestore the same way
    const db={
      doc:path=>({set:data=>fs.setDoc(fs.doc(store,path),data)}),
      collection:name=>({onSnapshot:(next,err)=>fs.onSnapshot(fs.collection(store,name),
        snap=>next({docs:snap.docs.map(d=>({id:d.id,data:()=>d.data()})),metadata:{fromCache:snap.metadata.fromCache}}),err)})
    };
    startShared(db,null,u.uid);
    return true;
  }catch(e){console.warn("Firebase connect failed",e);toast("Couldn't reach shared ratings — saving on this device for now.");return false;}
}
let migrated={};
async function migrate(kind,local){
  // carry over anything rated on this device before shared storage was available
  if(migrated[kind]||!S.canWrite)return; migrated[kind]=true;
  const keys=Object.keys(local||{}); if(!keys.length)return;
  const cur=(kind==="reviews"?S.reviewsByUser:S.placesByUser)[S.myId]||{};
  const add=keys.filter(k=>!cur[k]); if(!add.length)return;
  const merged={...cur};add.forEach(k=>merged[k]=local[k]);
  try{await S.db.doc(kind+"/"+S.myId).set(kind==="places"?{items:merged,fixes:S.fixesByUser[S.myId]||{},updatedAt:Date.now()}:reviewsDoc(merged));const d=lsGet();delete d[kind];lsSet(d);}catch(e){}
}

/* ================= VIEWS (Top / Mine) ================= */
const SORTS=[["overall",ic("star")+"Best overall"],["quality",ic("quality")+"Best food"],["options",ic("options")+"Most options"],["smell",ic("smell")+"Best smell"],["parking",ic("parking")+"Best parking"],["cold",ic("freezing")+"Coldest"],["hot",ic("hot")+"Warmest"],["count",ic("fire")+"Most rated"]];
function renderTop(anim=true){
  document.getElementById("statusTop").innerHTML=statusHtml();
  document.getElementById("sortSeg").innerHTML=SORTS.map(([k,l])=>`<button class="chip${S.sort===k?" on":""}" data-k="${k}">${l}</button>`).join("");
  document.getElementById("sportSeg").innerHTML=[["all","All sports"],["hockey",ico("hockey",16,2)+"Hockey"],["basketball",ico("basketball",16,2)+"Basketball"],["soccer",ico("soccer",16,2)+"Soccer"]].map(([k,l])=>`<button class="chip${S.sortSport===k?" on":""}" data-k="${k}">${l}</button>`).join("");
  document.getElementById("levelSeg").innerHTML=[["all","All levels"],...Object.entries(LEVELS)].map(([k,l])=>`<button class="chip${S.level===k?" on":""}" data-k="${k}">${l}</button>`).join("");
  const rows=ARENAS.filter(a=>passFilters(a,S.sortSport,S.level,"all")).map(a=>({a,st:stats(a.id)}));
  const rated=rows.filter(r=>r.st.n),unrated=rows.filter(r=>!r.st.n).sort((x,y)=>x.a.name.localeCompare(y.a.name));
  const key={overall:r=>r.st.overall,parking:r=>r.st.parking||0,quality:r=>r.st.quality,options:r=>r.st.options,smell:r=>r.st.smell,cold:r=>-r.st.temp,hot:r=>r.st.temp,count:r=>r.st.n}[S.sort];
  if(S.sort==="parking"){for(let i=rated.length-1;i>=0;i--)if(!rated[i].st.pn)unrated.unshift(rated.splice(i,1)[0]);}
  rated.sort((x,y)=>key(y)-key(x)||y.st.n-x.st.n);
  const val=r=>S.sort==="cold"||S.sort==="hot"?`${tempWord(r.st.temp)[0]}<small>${tempWord(r.st.temp)[1]}</small>`:S.sort==="count"?`${r.st.n}<small>ratings</small>`:`${fmt(r.st[S.sort==="overall"?"overall":S.sort])}<small>${r.st.n} rating${r.st.n>1?"s":""}</small>`;
  let h=rated.map((r,i)=>`<button class="rank${i<3?" top"+(i+1):""}" data-id="${r.a.id}" style="animation-delay:${anim?Math.min(i,12)*45:0}ms${anim?"":";animation:none"}"><div class="n">${i<3?i+1:i+1}</div><div class="badge b-${mainSport(r.a)}">${ico(mainSport(r.a))}</div><div class="mid"><div class="t">${esc(r.a.name)}</div><div class="s">${esc(r.a.city)} · ${esc(r.a.teams)}</div></div><div class="v">${val(r)}</div></button>`).join("");
  if(!rated.length)h+=`<div class="q" style="text-align:center"><div class="bigic">${ic("arena")}</div><h4>No ratings yet</h4><p style="margin:6px 0 0">Find an arena on the map and be the first to rate it.</p></div>`;
  if(unrated.length)h+=`<div class="sec"><h3>Not rated yet · ${unrated.length}</h3></div>`+unrated.map((r,i)=>`<button class="rank" data-id="${r.a.id}" style="${anim?`animation-delay:${Math.min(rated.length+i,14)*40}ms`:"animation:none"}"><div class="n">·</div><div class="badge b-${mainSport(r.a)}">${ico(mainSport(r.a))}</div><div class="mid"><div class="t">${esc(r.a.name)}</div><div class="s">${esc(r.a.city)}</div></div><div class="v" style="color:var(--muted);font-size:14px">Rate →</div></button>`).join("");
  document.getElementById("rankList").innerHTML=h;
}
document.getElementById("sortSeg").addEventListener("click",e=>{const b=e.target.closest(".chip");if(b){S.sort=b.dataset.k;renderTop();}});
document.getElementById("levelSeg").addEventListener("click",e=>{const b=e.target.closest(".chip");if(b){S.level=b.dataset.k;S.league="all";renderChips();drawMarkers();renderTop();}});
document.getElementById("sportSeg").addEventListener("click",e=>{const b=e.target.closest(".chip");if(b){S.sortSport=b.dataset.k;renderTop();}});
function renderMine(anim=true){
  document.getElementById("statusMine").innerHTML=statusHtml();
  const mine=S.reviewsByUser[S.myId]||{}; const ids=Object.keys(mine).filter(id=>BYID[id]).sort((a,b)=>mine[b].at-mine[a].at);
  const places=Object.keys(S.placesByUser[S.myId]||{}).filter(id=>BYID[id]);
  let h="";
  if(!ids.length)h+=`<div class="q" style="text-align:center"><div class="bigic">${ic("star")}</div><h4>You haven't rated anything yet</h4><p style="margin:6px 0 14px">Tap a pin on the map, then “Rate this arena”.</p><button class="cta alt" data-go="map" style="margin:0">Open the map</button></div>`;
  else h+=ids.map((id,i)=>{const r=mine[id],a=BYID[id],ov=revOverall(r);return `<button class="rank" data-id="${id}" style="${anim?`animation-delay:${Math.min(i,12)*45}ms`:"animation:none"}"><div class="badge b-${mainSport(a)}">${ico(mainSport(a))}</div><div class="mid"><div class="t">${esc(a.name)}</div><div class="s">${TEMPS[r.temp-1][0]} ${TEMPS[r.temp-1][1]} · ${CAT_EM.smell}${r.smell} ${CAT_EM.options}${r.options} ${CAT_EM.quality}${r.quality}${r.parking?" "+CAT_EM.parking+r.parking:""}</div></div><div class="v">${fmt(ov)}<small>your score</small></div></button>`}).join("");
  if(places.length)h+=`<div class="sec"><h3>Arenas you added</h3></div>`+places.map(id=>{const a=BYID[id];return `<button class="rank" data-id="${id}" style="animation:none"><div class="badge b-${mainSport(a)}">${ic("pin")}</div><div class="mid"><div class="t">${esc(a.name)}</div><div class="s">${esc(a.city)}</div></div></button>`}).join("");
  document.getElementById("mineList").innerHTML=h;
}
["rankList","mineList"].forEach(id=>document.getElementById(id).addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){switchTab("map");return;}
  const b=e.target.closest(".rank");if(b)openArena(b.dataset.id,true);
}));

/* ================= TABS ================= */
const nav=document.getElementById("nav");
function switchTab(t){
  if(t===S.tab)return; const prev=S.tab; S.tab=t;
  nav.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
  const order=["map","top","mine"];
  ["top","mine"].forEach(v=>{const el=document.getElementById("view-"+v);
    if(v===t){el.classList.remove("left");el.classList.add("on");el.scrollTop=0;}
    else{el.classList.remove("on");el.classList.toggle("left",order.indexOf(v)<order.indexOf(t));}
  });
  if(t==="top")renderTop(); if(t==="mine")renderMine();
  if(t!=="map"){closeResults();if(sheetState!=="hidden")setSheet("hidden");}
  else if(S.selected&&prev!=="map")setTimeout(()=>setSheet("peek"),250);
}
nav.addEventListener("click",e=>{const b=e.target.closest("button");if(b)switchTab(b.dataset.tab)});

/* ================= ADD ARENA ================= */
let placing=false,placeAt=null,addSport="hockey",addLevel="minor";
const placingBar=document.getElementById("placing");
let placeTarget=null;
function startPlacing(target){
  if(!S.canWrite){toast("You need Contributor access to do that.");return;}
  if(!map){toast("The map isn't available, so pins can't be placed.");return;}
  placeTarget=target||null;closeResults();
  const a=placeTarget&&BYID[placeTarget];
  if(sheetState!=="hidden")closeSheet();
  placing=true;document.body.classList.add("placing-mode");placingBar.classList.add("on");
  placingBar.querySelector("span").textContent=a?`Drag the map so the pin sits on ${a.name}`:"Move the map so the pin sits on the arena";
  if(a)map.flyTo([a.lat,a.lng],15,{duration:1});
  else if(map.getZoom()<9)toast("Zoom in close to the arena, then tap “Here”.");
}
document.getElementById("addBtn").onclick=()=>startPlacing(null);
function endPlacing(){placing=false;document.body.classList.remove("placing-mode");placingBar.classList.remove("on");}
document.getElementById("placeCancel").onclick=()=>{const t=placeTarget;endPlacing();if(t)openArena(t,false);};
document.getElementById("placeOk").onclick=()=>{
  if(map.getZoom()<(placeTarget?12:6)){toast("Zoom in a bit more so the pin lands in the right spot.");return;}
  const c=map.getCenter(); placeAt={lat:+c.lat.toFixed(5),lng:+(((c.lng+540)%360)-180).toFixed(5)};
  const t=placeTarget; endPlacing();
  if(t){saveFix(t,{...placeAt,at:Date.now()}).then(ok=>{if(!ok)return;rebuild();celebrate("Pin moved!");setTimeout(()=>openArena(t,true),900);});return;}
  openAdd();
};
function openAdd(){
  ["aName","aCity","aTeams"].forEach(id=>document.getElementById(id).value="");
  addSport="hockey";addLevel="minor";renderSportPick();
  document.getElementById("aWhere").textContent=`Pin placed at ${placeAt.lat.toFixed(3)}, ${placeAt.lng.toFixed(3)}`;
  document.getElementById("addModal").classList.add("on");
  setTimeout(()=>document.getElementById("aName").focus(),500);
}
function renderSportPick(){document.getElementById("aSport").innerHTML=Object.entries(SPORT).map(([k,s])=>`<button data-k="${k}" class="${addSport===k?"on":""}"><span>${ico(k,24,1.7)}</span>${s.label}</button>`).join("");
  document.getElementById("aLevel").innerHTML=Object.entries(LEVELS).map(([k,l])=>`<button data-k="${k}" class="${addLevel===k?"on":""}" style="height:48px">${l}</button>`).join("");}
document.getElementById("aLevel").addEventListener("click",e=>{const b=e.target.closest("button");if(b){addLevel=b.dataset.k;renderSportPick();}});
document.getElementById("aSport").addEventListener("click",e=>{const b=e.target.closest("button");if(b){addSport=b.dataset.k;renderSportPick();}});
document.getElementById("addClose").onclick=()=>document.getElementById("addModal").classList.remove("on");
document.getElementById("addSubmit").onclick=async()=>{
  const nameEl=document.getElementById("aName"); const name=nameEl.value.trim();
  if(!name){nameEl.classList.remove("shake");void nameEl.offsetWidth;nameEl.classList.add("shake");nameEl.focus();return;}
  const slug=norm(name).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"arena";
  const id="c-"+slug+"-"+Math.random().toString(36).slice(2,7);
  const p={name,city:document.getElementById("aCity").value.trim(),teams:document.getElementById("aTeams").value.trim(),sport:addSport,level:addLevel,lat:placeAt.lat,lng:placeAt.lng,at:Date.now()};
  const b=document.getElementById("addSubmit");b.disabled=true;
  const ok=await savePlace(id,p); b.disabled=false; if(!ok)return;
  document.getElementById("addModal").classList.remove("on");
  if((S.sport!=="all"&&S.sport!==addSport)||(S.level!=="all"&&S.level!==addLevel)||S.league!=="all"){S.sport="all";S.level="all";S.league="all";renderChips();}
  rebuild(); celebrate("Arena added!");
  setTimeout(()=>openArena(id,true),900);
};

/* ================= MISC ================= */
let toastT;
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),3000);}
window.addEventListener("resize",()=>{if(sheetState!=="hidden")setSheet(sheetState,false)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(rateModal.classList.contains("on"))closeRate();else if(sheetState!=="hidden")closeSheet();}});

renderChips(); initMap(); setSheet("hidden",false);
(function(){const sp=document.getElementById("splash");const hide=()=>{sp.classList.add("hide");setTimeout(()=>sp.remove(),700)};
  let seen=false;try{seen=sessionStorage.getItem("tbr.splash")==="1";sessionStorage.setItem("tbr.splash","1")}catch(e){}
  if(seen){sp.remove();return;} sp.addEventListener("click",hide); setTimeout(hide,2300);})();
connectFirebase().then(ok=>{if(!ok)connectShared();});
